name: keepalive

# Réveille le bot toutes les 5 minutes pour empêcher Render (plan gratuit)
# de mettre le service en sommeil → plus de coupures "à l'improviste".
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le bot (avec retents)
        run: |
          for i in 1 2 3 4; do
            if curl -sf --max-time 45 https://whatsapp-bot-3dx8.onrender.com/ping; then
              echo "✅ bot éveillé (tentative $i)"
              exit 0
            fi
            sleep 30
          done
          echo "❌ bot injoignable après 4 tentatives"
          exit 1
